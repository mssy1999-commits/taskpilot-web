name: Unpack zip
on:
  push:
    paths: ['*.zip']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          Z="$(ls -t *.zip | head -1)"
          unzip -o "$Z" -d .
          git rm -q --cached *.zip || true
          rm -f *.zip
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Unpack $Z" || echo "nothing to commit"
          git push
